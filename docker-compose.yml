services:
  db:
    image: postgres:16
    container_name: alerta360-db
    environment:
      POSTGRES_DB: alerta360
      POSTGRES_USER: alerta360
      POSTGRES_PASSWORD: alerta360_dev
    ports:
      - "5432:5432"
    volumes:
      - alerta360-pgdata:/var/lib/postgresql/data

volumes:
  alerta360-pgdata:
