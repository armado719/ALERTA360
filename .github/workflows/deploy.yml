name: CD - Deploy to Production

# Flujo:
#   1. build-and-push  → imagen del backend a ghcr + artefacto `dist/` del frontend
#   2. deploy          → rsync de `dist/` y de la configuración al servidor,
#                        `docker compose` v2, `prisma db push`, health check público
#                        y rollback automático al tag anterior si algo falla.
#
# Secretos requeridos (Settings → Secrets → Actions):
#   PROD_HOST, PROD_USER, PROD_SSH_KEY
# Variable opcional (Settings → Variables → Actions):
#   PROD_DOMAIN  (por defecto alerta360.com)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22'

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
      image_tag: ${{ steps.names.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      # GHCR exige nombres en minúsculas y el repositorio puede traer mayúsculas.
      - name: Resolver nombres
        id: names
        run: |
          echo "image=${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.names.outputs.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      DOMAIN: ${{ vars.PROD_DOMAIN || 'alerta360.com' }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Descargar build del frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-production
          path: dist

      - name: Validar artefacto
        run: |
          test -f dist/index.html
          test -f dist/status.html
          du -sh dist

      - name: Validar secretos de despliegue
        run: |
          if [ -z "${{ secrets.PROD_HOST }}" ]; then
            echo "❌ Falta el secreto PROD_HOST (Settings → Secrets → Actions)"
            exit 1
          fi
          if [ -z "${{ secrets.PROD_USER }}" ]; then
            echo "❌ Falta el secreto PROD_USER (Settings → Secrets → Actions)"
            exit 1
          fi
          if [ -z "${{ secrets.PROD_SSH_KEY }}" ]; then
            echo "❌ Falta el secreto PROD_SSH_KEY (Settings → Secrets → Actions)"
            exit 1
          fi
          echo "✅ Secretos de despliegue presentes"

      - name: Preparar clave SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      # rsync del build y de la configuración de infraestructura (no toca
      # `.env.production`, `ssl/` ni los volúmenes).
      - name: Subir frontend y configuración
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          DEST="${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/alerta360"
          rsync -az --delete --chmod=D755,F644 \
            --rsync-path="mkdir -p /opt/alerta360/dist.new && rsync" \
            -e "$SSH" dist/ "$DEST/dist.new/"
          # `backend/` viaja para que el fallback `docker compose build` funcione
          # si la imagen de ghcr no es accesible desde el servidor.
          rsync -az --exclude node_modules --exclude dist --exclude '.env*' \
            --rsync-path="mkdir -p /opt/alerta360 && rsync" -e "$SSH" \
            docker-compose.prod.yml nginx.conf monitoring/ scripts/ backend/ \
            "$DEST/"

      - name: Desplegar en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/alerta360

            # 1. Frontend: swap atómico (dist.old queda para el rollback)
            rm -rf dist.old
            if [ -d dist ]; then mv dist dist.old; fi
            mv dist.new dist

            # 2. Variables de producción (compose no lee .env.production solo)
            set -a
            . ./.env.production
            set +a
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            # 3. Imagen: registry con fallback a build local
            docker compose -f docker-compose.prod.yml pull backend \
              || docker compose -f docker-compose.prod.yml build backend

            # 4. Base de datos arriba antes de tocar el esquema (en el primer
            #    despliegue `run --no-deps` no arrancaría la BD)
            docker compose -f docker-compose.prod.yml up -d db
            i=0
            until docker compose -f docker-compose.prod.yml exec -T db \
                  pg_isready -U "$DB_USER" -d "$DB_NAME" > /dev/null 2>&1; do
              i=$((i + 1))
              if [ "$i" -ge 30 ]; then echo "La base de datos no arrancó"; exit 1; fi
              sleep 2
            done

            # 5. Esquema (aditivo) antes de arrancar la nueva versión
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              backend npx prisma db push --skip-generate

            # 6. Arranque
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 7. nginx: validar configuración y recargar si cambió
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            # 8. Backend sano en local antes de dar el despliegue por bueno
            i=0
            until docker compose -f docker-compose.prod.yml exec -T backend \
                  node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; do
              i=$((i + 1))
              if [ "$i" -ge 20 ]; then
                echo "El backend no respondió en 60 s"
                exit 1
              fi
              sleep 3
            done
            echo "Backend sano con IMAGE_TAG=$IMAGE_TAG"

      - name: Health check público
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "https://$DOMAIN/health" -o /tmp/health.json \
               && jq -e '.status == "ok"' /tmp/health.json > /dev/null; then
              echo "✅ API sana:"; jq -c '{status, version, uptimeSeconds}' /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          echo "❌ /health no devolvió status=ok en 90 s"
          cat /tmp/health.json 2> /dev/null || true
          exit 1

      - name: Verificar frontend y página de estado
        run: |
          curl -fsS --max-time 10 "https://$DOMAIN/" -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          curl -fsS --max-time 10 "https://$DOMAIN/status" -o /tmp/status.html
          grep -qi 'ALERTA360' /tmp/status.html
          echo "✅ index.html y /status servidos por nginx"

      - name: Registrar versión desplegada
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/alerta360
            echo "${{ needs.build-and-push.outputs.image_tag }}" > .current_tag
            rm -rf dist.old
            docker image prune -f > /dev/null

      # Solo se ejecuta si algo anterior falló. Deja el frontend anterior y,
      # si existe, vuelve a levantar el tag que estaba en producción.
      - name: Rollback
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/alerta360
            if [ -d dist.old ]; then
              rm -rf dist
              mv dist.old dist
              echo "Frontend revertido"
            fi
            PREV="$(cat .current_tag 2> /dev/null || true)"
            if [ -n "$PREV" ]; then
              set -a
              . ./.env.production
              set +a
              IMAGE_TAG="$PREV" docker compose -f docker-compose.prod.yml up -d backend
              echo "Rollback del backend a $PREV"
            else
              echo "Sin tag anterior registrado: primer despliegue, no hay rollback"
            fi

