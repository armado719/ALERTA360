version: '3.8'

services:
  # PostgreSQL Database (Production)
  db:
    image: postgres:16-alpine
    container_name: alerta360-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - alerta360-network

  # Backend API (Production)
  backend:
    image: ghcr.io/armado719/alerta360-backend:latest
    container_name: alerta360-backend-prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://alerta360.com
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alerta360-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: alerta360-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - alerta360-network

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: alerta360-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - alerta360-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: alerta360-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - alerta360-network

volumes:
  postgres_data_prod:
  prometheus_data:
  grafana_data:

networks:
  alerta360-network:
    driver: bridge
EOF