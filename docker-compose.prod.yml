services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: alerta360-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - alerta360-network

  # ---------------------------------------------------------------------------
  # Backend API (imagen publicada por GitHub Actions; build local como respaldo)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/armado719/alerta360-backend:${IMAGE_TAG:-latest}
    container_name: alerta360-backend-prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://alerta360.com}
      USGS_ENABLED: ${USGS_ENABLED:-true}
      NOAA_ENABLED: ${NOAA_ENABLED:-true}
      INGEST_INTERVAL: ${INGEST_INTERVAL:-120000}
      # Fuentes globales
      EONET_ENABLED: ${EONET_ENABLED:-true}
      EONET_BBOX: ${EONET_BBOX:-}
      EONET_DAYS: ${EONET_DAYS:-30}
      GDACS_ENABLED: ${GDACS_ENABLED:-true}
      GDACS_DAYS: ${GDACS_DAYS:-30}
      NHC_ENABLED: ${NHC_ENABLED:-true}
      NHC_URL: ${NHC_URL:-https://mapservices.weather.noaa.gov/tropical/rest/services/tropical/NHC_tropical_weather_summary/MapServer/7/query}
      NHC_TIMEOUT: ${NHC_TIMEOUT:-10000}
      GEOCODE_ENABLED: ${GEOCODE_ENABLED:-true}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      # Entrega de alertas (vacío = el canal queda en `skipped`)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-alertas@alerta360.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

  # ---------------------------------------------------------------------------
  # Nginx: TLS, gzip, rate limiting y estáticos
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: alerta360-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./dist:/usr/share/nginx/html:ro
      - acme_webroot:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider --no-check-certificate https://127.0.0.1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

  # ---------------------------------------------------------------------------
  # Certificados Let's Encrypt (renovación cada 12 h)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: alerta360-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: alerta360-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

  # ---------------------------------------------------------------------------
  # Alertmanager
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alerta360-alertmanager
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:9/alerta360}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--config.expand-env'
    ports:
      - '127.0.0.1:9093:9093'
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

  # ---------------------------------------------------------------------------
  # Grafana (datasource y dashboard provisionados)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: alerta360-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://alerta360.com/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

  # ---------------------------------------------------------------------------
  # Exporters
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: alerta360-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: alerta360-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

  # ---------------------------------------------------------------------------
  # Backup diario de PostgreSQL (pg_dump comprimido + retención de 7 días)
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: alerta360-backup
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do /usr/local/bin/backup.sh || echo 'backup failed'; sleep 24h & wait $${!}; done"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - alerta360-network

volumes:
  postgres_data_prod:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  acme_webroot:

networks:
  alerta360-network:
    driver: bridge
